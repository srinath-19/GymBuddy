[project]
name = "gymbuddy"
version = "0.1.0"
description = "Voice-first workout tracking app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "openai-agents>=0.13.6",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "pyjwt[crypto]>=2.12.1",
    # Required by FastAPI to parse multipart uploads (/api/v1/transcribe).
    "python-multipart>=0.0.20",
    "google-api-python-client>=2.0.0",
    "upstash-redis>=1.1.0",
    # zoneinfo has no bundled tz database on Windows, and Linux images are not
    # guaranteed to ship one either — required for all client-timezone handling.
    "tzdata>=2025.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]
